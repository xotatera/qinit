[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
serde_json = "1"
# Linux only; the default features would bring tokio.
inotify = { version = "0.11", default-features = false }

[lints]
workspace = true

# This crate's layer and allowed direct dependencies, checked by the
# `layers` gate. Widening `allow` is a reviewed change.
[package.metadata.disciplines]
layer = "tooling"
allow = ["inotify", "serde_json", "tree-sitter", "tree-sitter-rust"]
