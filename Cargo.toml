[workspace]
resolver = "3"
members = ["crates/qinit-cell", "crates/qinit-cell-core", "crates/qinit-cell-drive", "crates/qinit-client", "crates/qinit-colony", "crates/qinit-colony-core", "crates/qinit-db", "crates/qinit-db-core", "crates/qinit-event", "crates/qinit-event-core", "crates/qinit-frames", "crates/qinit-graph-core", "crates/qinit-ipc", "crates/qinit-launch", "crates/qinit-overseer", "crates/qinit-overseer-core", "crates/qinit-proto", "crates/qinit-proto-core", "crates/qinit-sys", "crates/qinit-vm", "crates/qinit-vm-guests", "crates/qinit-wire"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
libc = { version = "=0.2.189", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
vstd = { version = "=0.0.0-2026-10-04-0306", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.metadata.disciplines]
no_std_target = "x86_64-unknown-none"
proof_memory_budget = "8G"

# Proof tier (`cargo xtask proofs`): Verus for the core crates (spec 2026-10-27 §5.2).
# memory: at least 2G; container prlimit needs 4G virtual address space for
# Rust/LLVM linking on a rootless cgroup (resident peaks are much lower).
# timeout: CPU seconds, about 2x the run.
# Measured 2026-10-27: 2 verified, 12.9 s (19.3 s CPU), 1.0 GB peak.
# The final container KVM re-run took 20.1s wall; allow about twice that too.
[[workspace.metadata.disciplines.proof]]
name = "qinit-event-core"
kind = "verus"
package = "qinit-event-core"
memory = "4G"
timeout = "45s"

# Measured 2026-10-27: 29 verified, 12.6-15.7 s (18.9-22.3 s CPU), 986 MB peak.
[[workspace.metadata.disciplines.proof]]
name = "qinit-cell-core"
kind = "verus"
package = "qinit-cell-core"
memory = "4G"
timeout = "45s"

# Measured 2026-10-27: 12 verified, 13.5-14.2 s (19.9-21.0 s CPU), 1.0 GB peak.
# Container runs: 13.5 and 14.0 s; 45s covers 2x the slowest measured 21.0s CPU.
[[workspace.metadata.disciplines.proof]]
name = "qinit-cell-drive"
kind = "verus"
package = "qinit-cell-drive"
memory = "4G"
timeout = "45s"

# Measured 2026-11-02: 14 verified; cold build directory (as in a container) 12.4-12.7 s
# (18.5-18.9 s CPU), 0.95-1.0 GB peak; warm 0.6 s (0.5 s CPU), 221-289 MB peak.
# Re-measured 2026-11-02 (cold): 12.8-13.0 s (19.2-19.5 s CPU) at load ~6, 19.7-20.7 s (29.7-31.3 s
# CPU, summed over processes) at load ~23 on 32 threads. 45s covers about 2x the quiet 19.5s CPU.
[[workspace.metadata.disciplines.proof]]
name = "qinit-graph-core"
kind = "verus"
package = "qinit-graph-core"
memory = "4G"
timeout = "45s"

# Measured 2026-11-02 (layout, validator and NUL-list rule): 142 verified; cold build directory
# 17.4-21.7 s run (25.2-29.6 s CPU), 0.9-1.0 GB peak; warm 3.4 s (3.1 s CPU), 370 MB peak.
# After the spec split: 142 verified, cold 14.9-15.4 s (21.1-21.6 s CPU), 0.94-0.95 GB peak.
# 60s covers 2x the slowest measured 29.6s CPU.
# Group 1 (2026-11-04, one graph labelling, pool UTF-8 once, rlimit words): 223 verified, 14-16 s
# (21.6 s CPU) after a source change, warm 4.1 s; the timeout stands.
[[workspace.metadata.disciplines.proof]]
name = "qinit-db-core"
kind = "verus"
package = "qinit-db-core"
memory = "4G"
timeout = "60s"

# Measured 2026-11-02: 131 verified; warm 12.0-12.2 s (11.6-11.8 s CPU), 0.39-0.48 GB peak. A cold
# build (vstd included, as in a container) adds the 15-20 s the other crates show. 90s covers
# about 2.5x the expected cold CPU. SP6 gate run 2026-11-04: warm 16.4 s (16.0 s CPU), so cold is
# about 36 s CPU; 90s still covers 2.5x.
[[workspace.metadata.disciplines.proof]]
name = "qinit-colony-core"
kind = "verus"
package = "qinit-colony-core"
memory = "4G"
timeout = "90s"

# Measured 2026-11-04: 134 verified, 5.0-5.3 s (4.8-5.1 s CPU), 308 MB peak; 6.9 s (6.6 s CPU) in
# the SP6 gate run, where it once took 20 s under load. All warm: a cold build adds 15-20 s CPU
# (inferred), so 45s.
# Group 1 (2026-11-04, one step per rlimit): 139 verified, 6.0 s (5.8 s CPU) warm; 45s stands.
[[workspace.metadata.disciplines.proof]]
name = "qinit-overseer-core"
kind = "verus"
package = "qinit-overseer-core"
memory = "4G"
timeout = "45s"

# Measured 2026-11-04: 169 verified, warm 1.4-1.5 s (1.2 s CPU). A cold build (vstd included)
# adds the 15-20 s the other crates show (inferred, not measured cold); 45s covers about 2x that.
[[workspace.metadata.disciplines.proof]]
name = "qinit-proto-core"
kind = "verus"
package = "qinit-proto-core"
memory = "4G"
timeout = "45s"
