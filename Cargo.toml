[workspace]
resolver = "3"
members = ["crates/qinit-event", "crates/qinit-event-core", "crates/qinit-sys", "crates/qinit-vm"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
libc = { version = "=0.2.189", default-features = false }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
vstd = { version = "=0.0.0-2026-10-04-0306", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.metadata.disciplines]
no_std_target = "x86_64-unknown-none"
proof_memory_budget = "8G"

# Proof tier (`cargo xtask proofs`): Verus for the core crates (spec 2026-10-27 §5.2).
# memory: about 1.25x the measured peak, at least 2G; timeout: CPU seconds, about 2x the run.
# Measured 2026-10-27: 2 verified, 12.9 s (19.3 s CPU), 1.0 GB peak.
[[workspace.metadata.disciplines.proof]]
name = "qinit-event-core"
kind = "verus"
package = "qinit-event-core"
memory = "2G"
timeout = "40s"
