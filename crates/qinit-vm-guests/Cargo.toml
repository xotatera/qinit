[package]
name = "qinit-vm-guests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
libc = { workspace = true, features = ["std"] }
qinit-cell = { path = "../qinit-cell", features = ["test-hooks"] }
qinit-cell-core = { path = "../qinit-cell-core" }
qinit-event = { path = "../qinit-event" }
qinit-sys = { path = "../qinit-sys" }

[lints]
workspace = true

[package.metadata.disciplines]
layer = "tooling"
allow = ["libc", "qinit-cell", "qinit-cell-core", "qinit-event", "qinit-sys"]
