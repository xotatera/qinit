[package]
name = "qinit-vm-guests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
libc = { workspace = true, features = ["std"] }
qctl = { path = "../qctl" }
qinit-cell = { path = "../qinit-cell", features = ["test-hooks"] }
qinit-client = { path = "../qinit-client" }
qinit-colony = { path = "../qinit-colony" }
qinit-db = { path = "../qinit-db" }
qinit-event = { path = "../qinit-event" }
qinit-ipc = { path = "../qinit-ipc" }
qinit-overseer = { path = "../qinit-overseer" }
qinit-proto = { path = "../qinit-proto", features = ["testing"] }
qinit-sys = { path = "../qinit-sys" }

[dev-dependencies]
qinit-frames = { path = "../qinit-frames" }

[lints]
workspace = true

[package.metadata.disciplines]
layer = "tooling"
allow = ["libc", "qctl", "qinit-cell", "qinit-client", "qinit-colony", "qinit-db", "qinit-event", "qinit-ipc", "qinit-overseer", "qinit-proto", "qinit-sys"]
