[worker.logd]
exec = ["/usr/lib/qinit/logd", "--dir", "/var/log/qinit"]
restart = { policy = "on-failure", max = 3, window = "1m" }
cell = { memory_max = "16M", pids_max = 4 }
credentials = { uid = "logd" }
sandbox = { namespaces = ["ipc", "uts"], seccomp = "default", paths = ["ro:/etc/logd", "rw:/var/log/qinit"] }
env = { LOGD_DIR = "/var/log/qinit" }
cwd = "/var/log/qinit"
umask = 0o077
rlimits = { nofile = 1024 }
deps = [{ group = "require_all", edges = [{ to = "syslog-ng", restart_on = "restart" }] }]
