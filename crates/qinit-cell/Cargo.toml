[package]
name = "qinit-cell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Lets guest suites act between reading cgroup.procs and verifying each pidfd (spec §6.2 reuse-guard).
test-hooks = []

[dependencies]
libc = { workspace = true, features = ["std"] }
qinit-cell-core = { path = "../qinit-cell-core" }
qinit-cell-drive = { path = "../qinit-cell-drive" }
qinit-event = { path = "../qinit-event" }
qinit-sys = { path = "../qinit-sys" }

[lints]
workspace = true

[package.metadata.disciplines]
layer = "runtime"
allow = ["libc", "qinit-cell-core", "qinit-cell-drive", "qinit-event", "qinit-sys"]
