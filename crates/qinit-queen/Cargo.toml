[package]
name = "qinit-queen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "queen"
path = "src/main.rs"

[features]
# For the guests only: limits from `/run/queen-test`, `SIGUSR1` panics, `SIGUSR2` faults.
testing = []

[dependencies]
libc = { workspace = true, features = ["std"] }
qinit-ipc = { path = "../qinit-ipc" }
qinit-queen-core = { path = "../qinit-queen-core" }
qinit-sys = { path = "../qinit-sys" }

[lints]
workspace = true

[package.metadata.disciplines]
layer = "runtime"
allow = ["libc", "qinit-ipc", "qinit-queen-core", "qinit-sys"]
