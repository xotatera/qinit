[package]
name = "qinit-vm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
libc = { workspace = true, features = ["std"] }
qinit-event = { path = "../qinit-event" }
qinit-sys = { path = "../qinit-sys" }
