[package]
name = "qinit-overseer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "overseer"
path = "src/main.rs"

[dependencies]
libc = { workspace = true, features = ["std"] }
qinit-db = { path = "../qinit-db" }
qinit-overseer-core = { path = "../qinit-overseer-core" }
qinit-sys = { path = "../qinit-sys" }

[lints]
workspace = true

[package.metadata.disciplines]
layer = "runtime"
allow = ["libc", "qinit-db", "qinit-overseer-core", "qinit-sys"]
