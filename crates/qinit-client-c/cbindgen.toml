#
# cbindgen's configuration for include/qinit_client.h. The `header_is_current` test regenerates
# the header from it and fails when the checked-in file differs.

language = "C"
header = "/* SPDX-FileCopyrightText: 2026 Xota Tera */\n/* SPDX-License-Identifier: MPL-2.0 */\n/* Generated by cbindgen from crates/qinit-client-c; do not edit. The enum words are the\n   numbers of docs/control-protocol.md. */"
include_guard = "QINIT_CLIENT_H"
cpp_compat = true
# Tags, not typedefs: the struct `qinit_status` shares its name with the function `qinit_status`,
# and C keeps tags in their own namespace. The other structures get their typedefs below.
style = "tag"
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
after_includes = """

typedef struct qinit_client qinit_client;
typedef struct qinit_error qinit_error;
typedef struct qinit_node_info qinit_node_info;
typedef struct qinit_instance_info qinit_instance_info;
typedef struct qinit_entry qinit_entry;
typedef struct qinit_wait_result qinit_wait_result;
typedef struct qinit_launch_args qinit_launch_args;
typedef struct qinit_run_args qinit_run_args;
typedef struct qinit_begun qinit_begun;
typedef struct qinit_finish qinit_finish;
typedef struct qinit_event qinit_event;
typedef struct qinit_request qinit_request;"""

[const]
allow_static_const = false

[export]
item_types = ["constants", "structs", "opaque", "functions"]
