[package]
name = "qinit-client-c"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MPL-2.0"

# The C library is `libqinit_client_c` (a workspace cannot produce two `libqinit_client`
# artifacts); the rlib is what the crate's own tests link.
[lib]
name = "qinit_client_c"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
qinit-client = { path = "../qinit-client" }
qinit-launch = { path = "../qinit-launch" }

[dev-dependencies]
cbindgen = { version = "=0.29.4", default-features = false }
qinit-colony = { path = "../qinit-colony" }
qinit-colony-core = { path = "../qinit-colony-core" }
qinit-frames = { path = "../qinit-frames" }
qinit-ipc = { path = "../qinit-ipc" }
qinit-proto = { path = "../qinit-proto", features = ["testing"] }
qinit-sys = { path = "../qinit-sys" }

# The ffi layer is allowed `unsafe` (at the C boundary only); not `workspace = true` on purpose.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Layer and allowed direct dependencies, checked by the `layers` gate. The C interface depends on
# the MPL client and the MPL launch request only (the dev-dependencies are the GPL server it is
# tested against).
[package.metadata.disciplines]
layer = "ffi"
allow = ["qinit-client", "qinit-launch"]
