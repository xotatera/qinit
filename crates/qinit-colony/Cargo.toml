[package]
name = "qinit-colony"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
qinit-cell-core = { path = "../qinit-cell-core" }
qinit-colony-core = { path = "../qinit-colony-core" }
qinit-db = { path = "../qinit-db" }
qinit-overseer-core = { path = "../qinit-overseer-core" }
qinit-proto-core = { path = "../qinit-proto-core" }
qinit-wire = { path = "../qinit-wire" }

[dev-dependencies]
qinit-frames = { path = "../qinit-frames" }
qinit-launch = { path = "../qinit-launch" }
qinit-sys = { path = "../qinit-sys" }

[lints]
