# Two producers pipe to one logger: each waits for it.
[worker.logd]
credentials = { uid = "svc" }
exec = ["/bin/logd"]

[worker.p1]
credentials = { uid = "svc" }
exec = ["/bin/p1"]
output = { pipe = "logd" }

[worker.p2]
credentials = { uid = "svc" }
exec = ["/bin/p2"]
output = { pipe = "logd" }
