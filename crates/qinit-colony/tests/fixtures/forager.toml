# A one-shot job that needs a worker.
[worker.w]
credentials = { uid = "svc" }
exec = ["/bin/w"]

[forager.job]
credentials = { uid = "svc" }
exec = ["/bin/job"]
deps = [{ group = "require_all", edges = [{ to = "w" }] }]
