[package]
name = "qinit-colonyd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "qinit_colonyd"
path = "src/lib.rs"

[[bin]]
name = "colony"
path = "src/main.rs"

[dependencies]
libc = { workspace = true, features = ["std"] }
qinit-cell = { path = "../qinit-cell" }
qinit-cell-core = { path = "../qinit-cell-core" }
qinit-colony = { path = "../qinit-colony" }
qinit-colony-core = { path = "../qinit-colony-core" }
qinit-db = { path = "../qinit-db" }
qinit-event = { path = "../qinit-event" }
qinit-ipc = { path = "../qinit-ipc" }
qinit-launch = { path = "../qinit-launch" }
qinit-overseer = { path = "../qinit-overseer" }
qinit-proto = { path = "../qinit-proto" }
qinit-sys = { path = "../qinit-sys" }

[dev-dependencies]
qinit-frames = { path = "../qinit-frames" }

[lints]
workspace = true

[package.metadata.disciplines]
layer = "runtime"
allow = [
    "libc",
    "qinit-cell",
    "qinit-cell-core",
    "qinit-colony",
    "qinit-colony-core",
    "qinit-db",
    "qinit-event",
    "qinit-ipc",
    "qinit-launch",
    "qinit-overseer",
    "qinit-proto",
    "qinit-sys",
]
