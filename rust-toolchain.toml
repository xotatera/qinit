#
# Verus 0.2026.10.04.426d8b0 reports Rust 1.98.1 as its toolchain. The
# disciplines proof preflight asserts that Verus release when a proof declares
# it; this file pins only Rust, rustfmt, and clippy for the workspace.

[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
targets = ["x86_64-unknown-linux-musl", "x86_64-unknown-none"]
